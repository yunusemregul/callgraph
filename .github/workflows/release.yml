name: Release plugin

on:
  push:
    branches:
      - main
    paths:
      - build.gradle.kts
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish version
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read release version
        id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^version = "([^"]+)"$/\1/p' build.gradle.kts)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid or missing plugin version: $version" >&2
            exit 1
          fi

          tag="callgraph-$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag $tag already exists; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js 20
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/main/frontend/package-lock.json

      - name: Set up Gradle
        if: steps.version.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Install frontend dependencies
        if: steps.version.outputs.publish == 'true'
        working-directory: src/main/frontend
        run: npm ci

      - name: Verify release
        if: steps.version.outputs.publish == 'true'
        run: xvfb-run --auto-servernum ./verify-all

      - name: Build plugin ZIP
        if: steps.version.outputs.publish == 'true'
        run: ./gradlew buildPlugin --console=plain

      - name: Locate plugin ZIP
        if: steps.version.outputs.publish == 'true'
        id: artifact
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          artifact="build/distributions/callgraph-$VERSION.zip"
          if [[ ! -f "$artifact" ]]; then
            echo "Expected release artifact was not generated: $artifact" >&2
            exit 1
          fi
          echo "path=$artifact" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT: ${{ steps.artifact.outputs.path }}
        run: |
          gh release create "$TAG" "$ARTIFACT#CallGraph $VERSION plugin ZIP" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --latest
