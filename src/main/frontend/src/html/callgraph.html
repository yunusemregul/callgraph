<!DOCTYPE html>
<html lang="en">
<head>
    <title>Call Graph</title>
    <style>html, body { margin: 0; width: 100%; height: 100%; background: #1a1a1a; }</style>
</head>
<body>
<div id="root"></div>
<script defer="defer">
    <% /*
        Inline the bundle directly into the HTML so JCEF can load it without a separate file request.
        "inject: false" is set in webpack.config.js for this reason.
    */ %>
    <%= compilation.assets[webpackConfig.output.filename].source() %>
</script>
</body>
</html>
